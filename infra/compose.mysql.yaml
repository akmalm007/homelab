services:
  db-asbisindo:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: asbisindo_prod
      MYSQL_USER: asbisindo_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db-asbisindo:/var/lib/mysql
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
  vocasia:
    driver: bridge

volumes:
  db-asbisindo:
