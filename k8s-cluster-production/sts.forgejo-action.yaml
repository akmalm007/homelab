apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-action
  labels:
    app: forgejo-action
    git.akmalmaulana.net/forgejo: forgejo
    component: forgejo-runner
spec:
  selector:
    matchLabels:
      app: forgejo-action
      component: forgejo-runner
  serviceName: "docker-dind"
  replicas: 1
  template:
    metadata:
      labels:
        app: forgejo-action
        component: forgejo-runner
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: forgejo-runner
          image: code.forgejo.org/forgejo/runner:13
          volumeMounts:
            - name: forgejo-action-data
              mountPath: /data
            - name: forgejo-action-config
              mountPath: /data/runner-config.yaml
              subPath: runner-config.yaml
          command:
            ["forgejo-runner", "daemon", "--config", "runner-config.yaml"]
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
        - name: docker-dind
          image: docker:dind
          command:
            - sh
            - -c
            - |
              dockerd -H unix:///var/run/docker.sock -H tcp://0.0.0.0:2375 --tls=false --mtu=1450 &
              DOCKERD_PID=$!

              # Wait for the daemon to actually be ready before touching it
              until docker version >/dev/null 2>&1; do
                echo "waiting for dockerd..."
                sleep 1
              done

              # Custom docker networks (which forgejo-runner creates fresh
              # per-workflow-run) do NOT inherit dockerd's --mtu flag - that
              # only applies to the default docker0 bridge. So we pre-create
              # one persistent network with the correct MTU explicitly set,
              # and point runner-config.yaml's container.network at it.
              docker network inspect forgejo-actions >/dev/null 2>&1 || \
                docker network create --opt com.docker.network.driver.mtu=1450 forgejo-actions

              wait $DOCKERD_PID
          ports:
            - name: tcp
              containerPort: 2375
              protocol: TCP
          securityContext:
            privileged: true
          volumeMounts:
            - name: dind-data
              mountPath: /var/lib/docker
      volumes:
        - name: forgejo-action-config
          configMap:
            name: forgejo-action-config
  volumeClaimTemplates:
    - metadata:
        name: dind-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: forgejo-action-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: docker-dind
  labels:
    app: docker-dind
    component: forgejo-runner
spec:
  clusterIP: None
  selector:
    app: forgejo-action
    component: forgejo-runner
  ports:
    - name: tcp
      protocol: TCP
      port: 2375
      targetPort: 2375
