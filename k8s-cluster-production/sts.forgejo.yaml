apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: production
  name: forgejo
  labels:
    app: forgejo
    git.akmalmaulana.net/forgejo: forgejo
    component: forgejo
spec:
  selector:
    matchLabels:
      app: forgejo
      git.akmalmaulana.net/forgejo: forgejo
  serviceName: "forgejo"
  replicas: 1
  template:
    metadata:
      labels:
        app: forgejo
        git.akmalmaulana.net/forgejo: forgejo
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-ssh-dir
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              mkdir -p /data/ssh
              # Remove old SSH keys that might have wrong ownership
              rm -f /data/ssh/gitea.rsa /data/ssh/gitea.rsa.pub
              chown -R 1000:1000 /data/ssh
              chmod 700 /data/ssh
              find /data/ssh -type f -exec chmod 600 {} \; 2>/dev/null || true
          volumeMounts:
            - name: forgejo-data
              mountPath: /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ssh
              containerPort: 22
              protocol: TCP
          volumeMounts:
            - name: forgejo-data
              mountPath: /data
          envFrom:
            - configMapRef:
                name: forgejo-config
                optional: true
            - secretRef:
                name: forgejo-secret
          readinessProbe:
            httpGet:
              port: 3000
              path: /api/healthz
              scheme: HTTP
  volumeClaimTemplates:
    - metadata:
        name: forgejo-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
