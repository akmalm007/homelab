apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-action-config
data:
  labels: docker:docker://code.forgejo.org/oci/node:20-bookworm,ubuntu-22.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04,ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-24.04
  runner-config.yaml: |
    log:
      level: info
      job_level: info

    runner:
      file: .runner
      # Execute how many tasks concurrently at the same time.
      capacity: 1
      # Extra environment variables to run jobs.
      envs:
        A_TEST_ENV_NAME_1: a_test_env_value_1
        A_TEST_ENV_NAME_2: a_test_env_value_2
        DOCKER_HOST: tcp://forgejo-action:2375
      # Extra environment variables to run jobs from a file.
      # It will be ignored if it's empty or the file doesn't exist.
      env_file: .env
      timeout: 3h
      shutdown_timeout: 3h
      # Whether skip verifying the TLS certificate of the instance.
      insecure: false
      fetch_timeout: 30s
      # The interval for fetching the job from the Forgejo instance.
      fetch_interval: 2s
      # The interval for reporting the job status and logs to the Forgejo instance.
      report_interval: 1s
      labels:
        [
          "ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-24.04",
          "ubuntu-22.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04",
          "docker:docker://code.forgejo.org/oci/node:20-bookworm",
        ]

    cache:
      enabled: true
      port: 0
      dir: ""
      external_server: ""
      secret: ""
      secret_url: ""
      host: ""
      proxy_port: 0
      actions_cache_url_override: ""

    container:
      network: ""
      enable_ipv6: false
      privileged: false
      options:
      workdir_parent:
      valid_volumes:
        - "**"
      docker_host: "automount"
      # Pull docker image(s) even if already present
      force_pull: false
      # Rebuild local docker image(s) even if already present
      force_rebuild: false

    host:
      # The parent directory of a job's working directory.
      # If it's empty, $HOME/.cache/act/ will be used.
      workdir_parent:

    server:
      connections:
