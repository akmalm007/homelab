# Nginx Configuration for phpMyAdmin Staging
# 
# HOMELAB: Use with mkcert or self-signed certificates
# PRODUCTION: Replace certificate paths with Let's Encrypt

# Upstream for phpMyAdmin Docker container
upstream phpmyadmin_staging {
    server 127.0.0.1:8081;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name phpmyadmin.local phpmyadmin.yourdomain.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name phpmyadmin.local phpmyadmin.yourdomain.com;

    # ============================================
    # SSL CONFIGURATION
    # ============================================
    
    # HOMELAB: Use mkcert or self-signed certificates
    ssl_certificate /home/$USER/Homelab/services/database/nginx-config/cert.pem;
    ssl_certificate_key /home/$USER/Homelab/services/database/nginx-config/cert-key.pem;
    
    # PRODUCTION: Let's Encrypt certificates
    # ssl_certificate /etc/letsencrypt/live/phpmyadmin.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/phpmyadmin.yourdomain.com/privkey.pem;
    
    # Modern SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ============================================
    # SECURITY HEADERS
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

    # ============================================
    # LOGGING
    # ============================================
    access_log /var/log/nginx/phpmyadmin-access.log;
    error_log /var/log/nginx/phpmyadmin-error.log;

    # ============================================
    # AUTHENTICATION
    # ============================================
    auth_basic "Restricted Access - Staging Database";
    auth_basic_user_file /etc/nginx/.htpasswd-phpmyadmin;


    # ============================================
    # RATE LIMITING
    # ============================================
    limit_req_zone $binary_remote_addr zone=phpmyadmin:10m rate=5r/m;
    limit_req zone=phpmyadmin burst=10 nodelay;

    # ============================================
    # PROXY CONFIGURATION
    # ============================================
    location / {
        proxy_pass http://phpmyadmin_staging;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
