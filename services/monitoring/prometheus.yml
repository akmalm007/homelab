global:
  scrape_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "frontend"
    static_configs:
      - targets: ["localhost:3001"]
  - job_name: "gitea"
    static_configs:
      - targets: ["localhost:3000"]
